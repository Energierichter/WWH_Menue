name: Speisepläne aktualisieren & veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    # Mo–Fr um 10:00 Uhr Münchner Zeit. GitHub-Cron läuft in UTC, daher zwei
    # Termine (08:00 UTC = 10:00 Sommerzeit, 09:00 UTC = 10:00 Winterzeit);
    # der Job prüft unten, welcher davon gerade 10 Uhr in München ist.
    - cron: "0 8,9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  timecheck:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          hour=$(TZ=Europe/Berlin date +%H)
          echo "Uhrzeit in München: $(TZ=Europe/Berlin date '+%a %H:%M')"
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$hour" = "10" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Nicht 10 Uhr in München – dieser Termin wird übersprungen."
          fi

  build:
    needs: timecheck
    if: needs.timecheck.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      # immer den Stand von main verwenden, egal von welchem Branch der Lauf startet
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Abhängigkeiten installieren
        run: pip install -r scraper/requirements.txt

      - name: Speisepläne abrufen
        run: python scraper/scrape.py

      - name: Neue Daten committen
        continue-on-error: true
        run: |
          git config user.name "menu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Speisepläne aktualisiert ($(date -u +%Y-%m-%d))"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push origin HEAD:main && break
              sleep 5
            done || echo "::warning::Push fehlgeschlagen – Seite wird trotzdem veröffentlicht."
          fi

      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp -r index.html assets data _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
