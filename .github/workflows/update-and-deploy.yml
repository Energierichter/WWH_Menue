name: Speisepläne aktualisieren & veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    # täglich 06:17 und 10:17 (UTC) – neue Pläne werden so zeitnah übernommen
    - cron: "17 6,10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Abhängigkeiten installieren
        run: pip install -r scraper/requirements.txt

      - name: Speisepläne abrufen
        run: python scraper/scrape.py

      - name: Neue Daten committen
        run: |
          git config user.name "menu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Speisepläne aktualisiert ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp -r index.html assets data _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
